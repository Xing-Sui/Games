};
function renderStory(){
let node=STORY[gameState.currentNode];if(!node)return;
let container=document.getElementById('story-content');
if(node.text){
for(let t of node.text){
let div=document.createElement('div');div.className='story-node';
if(t.type==='narration'){
div.innerHTML='<div class="narration">'+t.content+'</div>';
}else if(t.type==='dialogue'){
let sp=t.speaker;
if(gameState.characters[sp])sp=gameState.characters[sp].name;
else if(sp==='npc')sp='？？？';
div.innerHTML='<div class="dialogue"><div class="speaker '+t.speaker+'">'+sp+'：</div><div class="text">'+t.content+'</div></div>';
}
container.appendChild(div);
}
}
if(node.onEnter)node.onEnter();
let cc=document.getElementById('choices-content');cc.innerHTML='';
if(node.ending){showEnding(node.ending);return;}
if(node.choices&&node.choices.length>0){
for(let ch of node.choices){
if(ch.condition&&!ch.condition())continue;
let btn=document.createElement('button');btn.className='choice-btn';
let th='';
if(ch.tag){let tn={courage:'勇气',wisdom:'智慧',kind:'仁心',neutral:'中立'};th='<span class="choice-tag tag-'+ch.tag+'">'+(tn[ch.tag]||ch.tag)+'</span>';}
btn.innerHTML=th+ch.text;
btn.onclick=function(){makeChoice(ch)};
cc.appendChild(btn);
}
}
setTimeout(function(){document.getElementById('content-panel').scrollTop=document.getElementById('content-panel').scrollHeight},100);
updateUI();
}
function makeChoice(choice){
gameState.choicesMade++;
if(choice.panel){switchPanel(choice.panel);return;}
gameState.currentNode=choice.next;
renderStory();
}
let battleState=null;
function startBattle(battleId){
let b=BATTLES[battleId];if(!b)return;
battleState={id:battleId,name:b.name,enemies:JSON.parse(JSON.stringify(b.enemies)),onWin:b.onWin,turn:'player',log:[],defending:false};
document.getElementById('battle-title').textContent=b.name;
document.getElementById('battle-overlay').style.display='flex';
renderBattle();
}
function renderBattle(){
if(!battleState)return;
let ah='';
for(let c in gameState.characters){let ch=gameState.characters[c];let p=(ch.hp/ch.maxHp)*100;
ah+='<div class="battle-char"><div class="battle-char-name" style="color:'+(c==='jiang'?'#f472b6':c==='xie'?'#a78bfa':c==='gu'?'#34d399':'#fb923c')+'">'+ch.name+' Lv.'+ch.level+'</div><div class="battle-char-hp"><div class="battle-char-hp-fill" style="width:'+p+'%"></div></div><div style="font-size:11px;color:#94a3b8;margin-top:2px;">'+ch.hp+'/'+ch.maxHp+'</div></div>';}
document.getElementById('battle-allies').innerHTML=ah;
let eh='';
battleState.enemies.forEach(function(e){if(e.hp<=0)return;let p=(e.hp/e.maxHp)*100;
eh+='<div class="battle-enemy"><div class="battle-enemy-name">'+e.name+'</div><div class="battle-char-hp" style="margin-top:6px;"><div class="battle-char-hp-fill" style="width:'+p+'%;background:linear-gradient(90deg,#ef4444,#f87171)"></div></div><div style="font-size:11px;color:#94a3b8;margin-top:2px;">'+e.hp+'/'+e.maxHp+'</div></div>';});
document.getElementById('battle-enemies').innerHTML=eh;
document.getElementById('battle-log').innerHTML=battleState.log.slice(-8).join('<br>');
if(battleState.turn==='player'){
document.getElementById('battle-actions').innerHTML='<button class="battle-btn attack" onclick="battleAction(\'attack\')">⚔️ 攻击</button><button class="battle-btn skill" onclick="battleAction(\'skill\')">✨ 技能</button><button class="battle-btn defend" onclick="battleAction(\'defend\')">🛡️ 防御</button><button class="battle-btn item" onclick="battleAction(\'item\')">💊 道具</button>';
}else{document.getElementById('battle-actions').innerHTML='';}
}
function battleAction(action){
if(battleState.turn!=='player')return;
let alive=battleState.enemies.filter(function(e){return e.hp>0});
if(alive.length===0)return;
let target=alive[0];
let player=gameState.characters.jiang;
let damage=0,logMsg='';
if(action==='attack'){
damage=Math.max(1,Math.floor(player.level*1.5+Math.random()*10)-target.def);target.hp-=damage;
logMsg='<span class="log-info">江心月 发动攻击！</span> 对 '+target.name+' 造成 <span class="log-damage">'+damage+'</span> 点伤害！';
}else if(action==='skill'){
damage=Math.max(1,Math.floor(player.level*2.5+Math.random()*15)-target.def);target.hp-=damage;
logMsg='<span class="log-info">江心月 发动【承影剑诀】！</span> 对 '+target.name+' 造成 <span class="log-damage">'+damage+'</span> 点伤害！';
['xie','gu','shen'].forEach(function(a){if(gameState.characters[a].hp>0){let d=Math.max(1,Math.floor(gameState.characters[a].level*1.2+Math.random()*8)-target.def);target.hp-=d;logMsg+='<br><span class="log-info">'+gameState.characters[a].name+' 协同攻击！</span> 造成 <span class="log-damage">'+d+'</span> 点伤害！';}});
}else if(action==='defend'){
battleState.defending=true;logMsg='<span class="log-info">全队进入防御姿态！</span> 下回合受到伤害减半。';
}else if(action==='item'){
if(gameState.inventory.huiLing&&gameState.inventory.huiLing>0){removeItem('huiLing',1);healAll(20);logMsg='<span class="log-heal">使用回灵丹！</span> 全队恢复 20 点体力！';}
else{notify('没有可用的丹药！','warning');return;}
}
battleState.log.push(logMsg);renderBattle();
if(battleState.enemies.every(function(e){return e.hp<=0})){setTimeout(function(){endBattle(true)},800);return;}
battleState.turn='enemy';setTimeout(function(){enemyTurn()},1000);
}
function enemyTurn(){
if(!battleState)return;
let alive=battleState.enemies.filter(function(e){return e.hp>0});
alive.forEach(function(enemy){
let targets=Object.keys(gameState.characters).filter(function(c){return gameState.characters[c].hp>0});
if(targets.length===0)return;
let t=targets[Math.floor(Math.random()*targets.length)];
let dmg=Math.max(1,Math.floor(enemy.atk+Math.random()*6)-Math.floor(gameState.characters[t].level/10));
if(battleState.defending)dmg=Math.floor(dmg/2);
damageChar(t,dmg);
battleState.log.push('<span class="log-damage">'+enemy.name+' 攻击 '+gameState.characters[t].name+'！</span> 造成 <span class="log-damage">'+dmg+'</span> 点伤害！');
});
battleState.defending=false;renderBattle();
if(gameState.characters.jiang.hp<=0){setTimeout(function(){endBattle(false)},800);return;}
battleState.turn='player';renderBattle();
}
function endBattle(won){
document.getElementById('battle-overlay').style.display='none';
if(won){
notify('战斗胜利！','success');
gameState.currentNode=battleState.onWin;battleState=null;renderStory();
}else{
notify('战斗失败……但你不能放弃！','danger');
healAll(30);
gameState.currentNode=battleState.onWin||gameState.currentNode;battleState=null;renderStory();
}
}
function switchPanel(panel){
document.querySelectorAll('.panel-view').forEach(function(p){p.classList.remove('active')});
document.querySelectorAll('.menu-btn').forEach(function(b){b.classList.remove('active')});
document.getElementById('panel-'+panel).classList.add('active');
document.querySelector('.menu-btn[data-panel="'+panel+'"]').classList.add('active');
let ca=document.getElementById('choices-area');
if(panel==='story'){ca.style.display='block';}else{ca.style.display='none';}
if(panel==='team')renderTeamPanel();
if(panel==='quest')renderQuestPanel();
if(panel==='map')renderMapPanel();
if(panel==='bag')renderBagPanel();
if(panel==='shop')renderShopPanel();
if(panel==='hint')renderHintPanel();
}
function renderTeamPanel(){
let html='';
for(let c in gameState.characters){let ch=gameState.characters[c];
let hpP=(ch.hp/ch.maxHp)*100;let hpC=hpP>50?'#22c55e':hpP>25?'#f59e0b':'#ef4444';
let ri=REALMS.indexOf(ch.realm);
let rh=REALMS.map(function(r,i){return '<span class="realm-step '+(i===ri?'current':i<ri?'passed':'')+'">'+r+'</span>'}).join('→');
let st={normal:'正常',injured:'轻伤',weak:'虚弱'}[ch.status]||'正常';
let sc={normal:'status-normal',injured:'status-injured',weak:'status-weak'}[ch.status]||'status-normal';
let ap=Math.min(100,(ch.affection/20)*100);
html+='<div class="character-card"><div class="char-header"><div><span class="char-name '+c+'">'+ch.name+'</span><span class="char-role">'+ch.role+'</span><span class="char-status '+sc+'">'+st+'</span></div><span class="char-level">Lv.'+ch.level+' '+ch.realm+'</span></div><div class="realm-bar">'+rh+'</div><div class="stat-row"><div class="stat-item hp-bar-wrap"><span class="stat-label">体力</span><span class="stat-value">'+ch.hp+'/'+ch.maxHp+'</span><div class="hp-bar-bg"><div class="hp-bar-fill" style="width:'+hpP+'%;background:'+hpC+'"></div></div></div></div><div class="stat-row"><div class="stat-item"><span class="stat-label">法器：</span><span class="stat-value">'+ch.weapon+' Lv.'+ch.weaponLv+'</span></div></div>'+(!ch.isPlayer?'<div class="affection-bar"><span class="affection-label">好感度：'+ch.affection+'</span><div class="affection-bg"><div class="affection-fill" style="width:'+ap+'%"></div></div></div>':'')+'</div>';}
document.getElementById('team-content').innerHTML=html;
}
function renderQuestPanel(){
let html='<div class="task-section"><div class="task-section-title">主线任务</div>';
gameState.quests.main.forEach(function(q){
let sc=q.status==='active'?'status-active':q.status==='done'?'status-done':'status-locked';
let st=q.status==='active'?'进行中':q.status==='done'?'已完成':'未解锁';
html+='<div class="task-card '+(q.status==='done'?'done':'')+'"><div class="task-title-row"><span class="task-name">'+q.name+'</span><span class="task-status '+sc+'">'+st+'</span></div><div class="task-desc">'+q.desc+'</div><div class="task-reward">奖励：'+q.reward+'</div></div>';});
html+='</div><div class="task-section"><div class="task-section-title">支线任务</div>';
if(gameState.quests.side.length===0)html+='<div class="inv-empty">暂无支线任务</div>';
html+='</div>';
document.getElementById('quest-content').innerHTML=html;
}
function renderMapPanel(){
let html='<div class="map-container">';
gameState.map.forEach(function(node,i){
let dc=node.status==='current'?'current':node.status==='visited'?'visited':'locked';
let ec=node.eye==='active'?'eye-active':node.eye==='strong'?'eye-strong':'eye-weak';
let et=node.eye==='active'?'已激活':node.eye==='strong'?'反应强烈':node.eye==='weak'?'反应微弱':'';
let info=node.status==='current'?'当前位置':node.status==='visited'?'已通过':'未发现';
html+='<div class="map-node '+node.status+'"><div class="map-dot '+dc+'"></div><div><span class="map-name '+node.status+'">'+node.name+'</span>'+(node.eye!=='none'?'<span class="spirit-eye-status '+ec+'">灵眼：'+et+'</span>':'')+'</div><span class="map-info">'+info+'</span></div>';
if(i<gameState.map.length-1)html+='<div class="map-connector"></div>';});
html+='<div style="text-align:right;margin-top:20px;color:#f472b6;font-size:14px;">北 ↑ &nbsp;&nbsp; 南 ↓</div></div>';
document.getElementById('map-content').innerHTML=html;
}
function renderBagPanel(){
let html='<div class="stone-display">💰 灵石：'+gameState.stones+'</div>';
let cats={pill:{name:'丹药类',items:[]},material:{name:'材料类',items:[]},fragment:{name:'法器碎片类',items:[]},special:{name:'特殊物品类',items:[]}};
for(let id in gameState.inventory){if(gameState.inventory[id]>0&&ITEMS[id])cats[ITEMS[id].type].items.push({id:id,count:gameState.inventory[id]});}
for(let cat in cats){
html+='<div class="inventory-section"><div class="inv-section-title">'+cats[cat].name+'</div>';
if(cats[cat].items.length===0){html+='<div class="inv-empty">暂无物品</div>';}
else{html+='<div class="inv-grid">';cats[cat].items.forEach(function(it){html+='<div class="inv-item"><div><div class="inv-item-name">'+ITEMS[it.id].name+'</div><div class="inv-item-desc">'+ITEMS[it.id].desc+'</div></div><span class="inv-item-count">×'+it.count+'</span></div>';});html+='</div>';}
html+='</div>';
}
document.getElementById('bag-content').innerHTML=html;
}
function renderShopPanel(){
let html='<div class="stone-display">💰 当前灵石：'+gameState.stones+'</div>';
html+='<button class="back-btn" onclick="switchPanel(\'story\')">← 返回剧情</button>';
html+='<div class="inventory-section"><div class="inv-section-title">消耗品</div>';
SHOP_ITEMS.forEach(function(id){let it=ITEMS[id];let can=gameState.stones>=it.price;
html+='<div class="shop-item"><div class="shop-item-info"><div class="shop-item-name">'+it.name+'</div><div class="shop-item-desc">'+it.desc+'</div></div><span class="shop-item-price">'+it.price+' 灵石</span><button class="buy-btn" '+(can?'':'disabled')+' onclick="buyItem(\''+id+'\')">购买</button></div>';});
html+='</div>';
document.getElementById('shop-content').innerHTML=html;
}
function buyItem(id){let it=ITEMS[id];if(gameState.stones>=it.price){gameState.stones-=it.price;addItem(id,1);renderShopPanel();updateUI();}else{notify('灵石不足！','warning');}}
function renderHintPanel(){
let html='<div class="tip-section"><div class="tip-section-title">主线与支线</div>';
let aq=gameState.quests.main.find(function(q){return q.status==='active'});
if(aq)html+='<div class="tip-item">当前主线：'+aq.name+' — '+aq.desc+'</div>';
html+='</div><div class="tip-section"><div class="tip-section-title">角色互动</div>';
['xie','gu','shen'].forEach(function(c){let ch=gameState.characters[c];
if(ch.hp<20)html+='<div class="tip-item urgent">'+ch.name+' 体力过低，建议使用丹药恢复！</div>';
if(ch.status!=='normal')html+='<div class="tip-item urgent">'+ch.name+' 状态异常：'+ch.status+'</div>';});
if(gameState.characters.shen.affection>=5)html+='<div class="tip-item">沈夜非常依赖你，多关心他可能会有意外收获。</div>';
html+='</div><div class="tip-section"><div class="tip-section-title">系统操作</div>';
for(let id in gameState.inventory){if(ITEMS[id]&&ITEMS[id].type==='fragment'&&gameState.inventory[id]>=5)html+='<div class="tip-item urgent">'+ITEMS[id].name+'已集齐5个，可以合成/强化法器！</div>';}
if(gameState.stones>50)html+='<div class="tip-item">你有较多灵石，可以去商城购买物资。</div>';
html+='<div class="tip-item">激活灵眼可以获得大量经验和稀有材料。</div></div>';
document.getElementById('hint-content').innerHTML=html;
}
function updateUI(){
document.getElementById('current-location').textContent=gameState.location;
document.getElementById('current-chapter').textContent=gameState.chapter;
document.getElementById('sidebar-stones').textContent=gameState.stones;
let hh='';
['jiang','xie','gu','shen'].forEach(function(c){let ch=gameState.characters[c];let p=(ch.hp/ch.maxHp)*100;let cls=p>50?'':p>25?'mid':'low';
hh+='<div class="hp-mini"><span class="name">'+ch.name+'</span><div class="bar"><div class="bar-fill '+cls+'" style="width:'+p+'%"></div></div></div>';});
document.getElementById('team-hp-display').innerHTML=hh;
let ap=document.querySelector('.panel-view.active');
if(ap){let pid=ap.id.replace('panel-','');
if(pid==='team')renderTeamPanel();
if(pid==='bag')renderBagPanel();
if(pid==='shop')renderShopPanel();}
}
function showEnding(type){
let titles={sacrifice:{title:'牺牲结局',subtitle:'— 以身殉道，万古流芳 —',cls:'bad'},together:{title:'同心结局',subtitle:'— 四人同心，其利断金 —',cls:'good'},perfect:{title:'完美结局',subtitle:'— 灵脉复苏，天下太平 —',cls:'true'}};
let info=titles[type]||titles.together;
document.getElementById('ending-title').textContent=info.title;
document.getElementById('ending-title').className='ending-title '+info.cls;
document.getElementById('ending-subtitle').textContent=info.subtitle;
let statsHtml='<div class="ending-stat"><div class="ending-stat-label">做出选择</div><div class="ending-stat-value">'+gameState.choicesMade+'</div></div><div class="ending-stat"><div class="ending-stat-label">激活灵眼</div><div class="ending-stat-value">'+gameState.map.filter(function(m){return m.eye==='active'}).length+'/4</div></div><div class="ending-stat"><div class="ending-stat-label">谢清晏好感</div><div class="ending-stat-value">'+gameState.characters.xie.affection+'</div></div><div class="ending-stat"><div class="ending-stat-label">顾昭白好感</div><div class="ending-stat-value">'+gameState.characters.gu.affection+'</div></div><div class="ending-stat"><div class="ending-stat-label">沈夜好感</div><div class="ending-stat-value">'+gameState.characters.shen.affection+'</div></div>';
document.getElementById('ending-stats').innerHTML=statsHtml;
document.getElementById('ending-screen').style.display='flex';
}
function saveGame(){try{localStorage.setItem('lingmai_save',JSON.stringify(gameState));notify('游戏已保存！','success');}catch(e){notify('保存失败：'+e.message,'danger');}}
function loadGame(){try{let d=localStorage.getItem('lingmai_save');if(d){gameState=JSON.parse(d);return true;}}catch(e){}return false;}
function hasSave(){return localStorage.getItem('lingmai_save')!==null;}
function startNewGame(){
gameState=initState();
document.getElementById('title-screen').style.display='none';
document.getElementById('ending-screen').style.display='none';
document.getElementById('game-screen').style.display='block';
document.getElementById('story-content').innerHTML='';
switchPanel('story');
renderStory();
}
function continueGame(){
if(loadGame()){
document.getElementById('title-screen').style.display='none';
document.getElementById('game-screen').style.display='block';
switchPanel('story');
renderStory();
notify('读取存档成功！','success');
}else{notify('没有找到存档！','warning');}
}
function confirmRestart(){if(confirm('确定要重新开始吗？当前进度将丢失（除非已保存）。')){startNewGame();}}
function backToTitle(){document.getElementById('ending-screen').style.display='none';document.getElementById('game-screen').style.display='none';document.getElementById('title-screen').style.display='flex';updateContinueButton();}
function showAbout(){alert('《灵脉复苏》\n\n修仙界的灵脉正在枯萎，你作为凌霄宗大师姐，带领三位师弟踏上寻找灵眼的旅途。\n\n游戏特色：\n• 丰富的剧情分支，你的每个选择都影响结局\n• 三位性格各异的师弟，好感度系统\n• 完整的战斗、背包、商城、任务系统\n• 多种结局等你探索\n\n操作：点击选项推进剧情，左侧菜单查看各面板。');}
function updateContinueButton(){document.getElementById('continue-btn').disabled=!hasSave();}
window.onload=function(){updateContinueButton();};
</script>
